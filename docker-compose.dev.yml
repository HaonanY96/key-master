version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    env_file:
      - .env.local
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev 